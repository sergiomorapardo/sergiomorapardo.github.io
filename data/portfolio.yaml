        repository: "AdvancedTopicsAnalytics"
        license: "GPL-3.0"
        url: "https://github.com/sergiomorapardo/AdvancedTopicsAnalytics"
        description: "A broad applied curriculum connecting MLOps and model monitoring with deep learning, NLP, transformers, recommendation systems, and Graph ML."
        topics: ["MLOps", "Transformers", "Graph ML", "Recommendation"]
        materials:
          - title: "Model monitoring with validation data"
            note: "A compact production-facing example."
            url: "https://github.com/sergiomorapardo/AdvancedTopicsAnalytics/blob/main/notebooks/ibm_hr_attrition_model_validation.ipynb"
          - title: "Recommendation systems with Node2Vec"
            note: "Graph representations applied to retrieval."
            url: "https://github.com/sergiomorapardo/AdvancedTopicsAnalytics/blob/main/notebooks/L25-Node2Vec-RecSys.ipynb"
          - title: "Introduction to transformers"
            note: "A practical bridge from attention to modern NLP."
            url: "https://github.com/sergiomorapardo/AdvancedTopicsAnalytics/blob/main/notebooks/L17-TransformersIntroduction.ipynb"
      - title: "Stochastic AI Techniques"
        role: "Follow-up instructor · Graduate course"
        repository: "StochasticAITechniquesClass"
        license: "MIT"
        url: "https://github.com/sergiomorapardo/StochasticAITechniquesClass"
        description: "A focused six-week sequence covering dimensionality reduction, prediction, classification, stochastic processes, and forecasting through reproducible notebooks."
        topics: ["PCA", "Model validation", "Monte Carlo", "Forecasting"]
        materials:
          - title: "Cross-validation and grid search"
            note: "A clean foundation for defensible model selection."
            url: "https://github.com/sergiomorapardo/StochasticAITechniquesClass/blob/main/Notebooks/L6_CrossValidation.ipynb"
          - title: "Markov chains and Monte Carlo simulation"
            note: "The strongest standalone stochastic lesson."
            url: "https://github.com/sergiomorapardo/StochasticAITechniquesClass/blob/main/Notebooks/L10_MarkovChains_MonteCarloSimulations.ipynb"
          - title: "Multi-horizon forecasting"
            note: "A practical time-series extension with clear applied value."
            url: "https://github.com/sergiomorapardo/StochasticAITechniquesClass/blob/main/Notebooks/L12_TimeSeries_MultiHorizont.ipynb"
    proofs:
      - value: "5+"
        label: "graduate cohorts since 2023"
      - value: "~20"
        label: "students per cohort"
      - value: "2"
        label: "graduate course tracks"
