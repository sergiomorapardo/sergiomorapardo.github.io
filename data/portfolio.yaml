    eyebrow: "Teaching"
    title: "Technical leadership also means making difficult ideas teachable."
    description: "As an adjunct professor, I design project-based graduate coursework across modern AI and classical stochastic methods, from CNNs and transformers to graph networks, time series, and Monte Carlo simulation."
    repositories_intro: "Two public course repositories show the progression from statistical foundations to production ML, NLP, and Graph ML. The links below are the strongest candidates for standalone teaching notes or future articles."
